// ----------------------------------------------------------------------------------------- aiming guide
// While dragging (or charging with the keyboard): the ball waits at the launch spot, a dotted arc shows its
// flight and a small bullseye marks where it will land. All three are "crisp", so the tilt-shift never blurs them.
const NDOTS = 40;
const dots = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), crisp(new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff4dc).multiplyScalar(1.25) })), NDOTS);
dots.frustumCulled = false; dots.renderOrder = 7; dots.count = 0; scene.add(dots);
const mark = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), crisp(new THREE.MeshBasicMaterial({ map: T.bullseye, alphaTest: 0.5, depthTest: false })));

const held = new THREE.Mesh(ballGeo, ballMat); held.visible = false; scene.add(held);

  if (!CONFIG.preview.enabled || state !== 'play') return hidePreview();
  if (swipe) { const t = swipeThrow(swipe, swipe.x, swipe.y, performance.now()); if (t) return showPreview(t.power, t.yaw, t.x0); }
  else if (charging) return showPreview(meterPower(chargeT), aimYaw, L.origin[0]);
  hidePreview();
  if (swipe) { held.visible = true; held.position.set(CONFIG.swipe.followFinger ? counterX(swipe.x0, swipe.y0) : L.origin[0], L.origin[1], L.origin[2]); held.quaternion.copy(camera.quaternion); } // finger down, not yet a throw

// ----------------------------------------------------------------------------------------- main loop
